<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morpion</title>
  <link rel="stylesheet" href="morpion.css">
</head>
<body>

  <h1>Morpion</h1>

 <div id="scores">
  <div><span id="name-x"></span> : <span id="score-x">0</span></div>
  <div><span id="name-o"></span> : <span id="score-o">0</span></div>
  <div>Nuls : <span id="score-draw">0</span></div>
</div>
  <p id="status">Au tour de X</p>

  <button id="restart">Nouvelle partie</button>

  <div id="game">
    <div id="grid"></div>
    <div id="win-line"></div>
  </div>

  <div id="overlay">
    <div id="winner-box">
      <h2 id="winner-text"></h2>
      <button id="play-again">Rejouer</button>
    </div>
  </div>
<div id="settings">
  <label>
    Manches pour gagner :
    <input type="number" id="target-score" min="1" value="3">
  </label>
</div>

  <script src="morpion.js"></script>

</body>
</html>
