<!DOCTYPE html>
<html lang="fr">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="description" content="Jouez à 2048, le célèbre 
  jeu de puzzle où vous combinez des tuiles pour atteindre le nombre 2048.
   Amusez-vous à défier votre esprit et à battre votre meilleur score !">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container-fluid text-center">
  <h1>2048</h1>

  <div id="infos">
    <div id="score">Score : 0</div>
    <div id="best">Meilleur : 0</div>
  </div>

  <button id="restart" class="btn btn-primary">Nouvelle partie</button>

  <div id="grid"></div>
  </div>
  <div id="game-over" class="overlay">
  </div>

  <script src="script.js"></script>
</body>
</html>
